<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LightDraw</title>
  <link rel="icon" type="image/png" sizes="256x256" href="./favicon.png">
  <style>
    html, body, #out { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    html, body { min-width: 920px; min-height: 600px; }
    #out { touch-action: none; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #f5f7fa; color: #1d2733; font: 16px system-ui, sans-serif; z-index: 1; }
    #loading[hidden] { display: none; }
    .loading-card { width: min(360px, 80vw); }
    #loading-status { display: block; margin-bottom: 16px; font-size: 20px; }
    #loading-progress { display: block; width: 100%; height: 12px; }
    #loading-progress[hidden] { display: none; }
    #loading-detail { display: block; margin-top: 10px; color: #526273; font-size: 14px; }
    #loading-error { margin-top: 16px; color: #a32626; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div id="out"></div>
  <div id="loading" role="status" aria-live="polite">
    <div class="loading-card">
      <strong id="loading-status">正在加载 LightDraw…</strong>
      <progress id="loading-progress" max="100" value="0"></progress>
      <span id="loading-detail">正在准备运行环境…</span>
      <div id="loading-error" hidden></div>
    </div>
  </div>
  <script>
    document.getElementById('out').addEventListener('contextmenu', event => event.preventDefault());
    document.getElementById('out').addEventListener('wheel', event => event.preventDefault(), { passive: false });
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
