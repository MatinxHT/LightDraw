name: Release desktop

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  prepare:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read project version
        id: version
        run: |
          python3 - <<'PY'
          import os, re, subprocess, xml.etree.ElementTree as ET
          version = ET.parse('Directory.Build.props').findtext('.//Version', '').strip()
          number = r'(?:0|[1-9][0-9]*)'
          if not re.fullmatch(rf'{number}\.{number}\.{number}', version):
              raise SystemExit('Directory.Build.props must contain a stable Version such as 0.7.3.')
          tag = f'v{version}'
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\nversion={version}\nsha={sha}\n')
          PY
      - name: Create or resume draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
        run: |
          # List releases so drafts are included; API/authentication errors must fail the job.
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > releases.json
          jq --arg tag "$RELEASE_TAG" \
            'first(.[][] | select(.tag_name == $tag)) // null' releases.json > release.json
          if jq -e '. != null and .draft == false' release.json > /dev/null; then
            echo "Release $RELEASE_VERSION is already published; skipping publication."
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if jq -e '. != null' release.json > /dev/null; then
            if [[ "$(jq -r '.target_commitish' release.json)" != "$RELEASE_SHA" ]]; then
              echo '::error::This draft targets another commit. Rerun its original workflow or bump the project version.'
              exit 1
            fi
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            if [[ "$(git rev-parse "$RELEASE_TAG^{commit}")" != "$RELEASE_SHA" ]]; then
              echo '::error::This version tag points to another commit. Bump the project version.'
              exit 1
            fi
          fi
          if ! jq -e '. != null' release.json > /dev/null; then
            gh release create "$RELEASE_TAG" --target "$RELEASE_SHA" --draft \
              --title "$RELEASE_VERSION" --generate-notes
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-2022
          - rid: win-arm64
            os: windows-2022
          - rid: osx-arm64
            os: macos-14
          - rid: linux-x64
            os: ubuntu-22.04
          - rid: linux-arm64
            os: ubuntu-22.04-arm
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RUNTIME_ID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # Leave the cache input unset: no Actions dependency cache is created.
      - name: Publish self-contained desktop app
        run: |
          dotnet publish src/LightDraw.Desktop/LightDraw.Desktop.csproj \
            --configuration Release --runtime "$RUNTIME_ID" \
            --self-contained true --output publish \
            -p:Version="$RELEASE_VERSION" -p:PublishTrimmed=false
      - name: Package app and checksum
        run: python scripts/package-release.py "$RUNTIME_ID" "$RELEASE_VERSION"
      # Upload directly from this runner to Releases. Do not add artifact or cache actions.
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" != true ]]; then
            echo 'Refusing to replace assets on a published release.' >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check all assets and publish release
        run: |
          gh release view "$RELEASE_TAG" --json isDraft,assets > release.json
          jq -e '.isDraft == true' release.json > /dev/null
          for rid in win-x64 win-arm64 osx-arm64 linux-x64 linux-arm64; do
            extension=tar.gz
            if [[ "$rid" == win-* ]]; then extension=zip; fi
            archive="LightDraw-${RELEASE_VERSION}-${rid}.${extension}"
            for asset in "$archive" "$archive.sha256"; do
              jq -e --arg name "$asset" \
                'any(.assets[]; .name == $name and .size > 0 and .state == "uploaded")' \
                release.json > /dev/null
            done
          done
          gh release edit "$RELEASE_TAG" --title "$RELEASE_VERSION" --draft=false
